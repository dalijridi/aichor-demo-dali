kind: "AIchorManifest"
apiVersion: "0.2.3"
builder:
  image: "delta-sharing-check"
  dockerfile: "./Dockerfile"
  context: "."
spec:
  operator: "jobset"
  image: "delta-sharing-check"
  command: "python validate_share.py"
  timeout: "60m"
  types:
    master:
      count: 1
      completions: 1
      parallelisms: 1
      resources:
        cpus: 4
        memory: 32
