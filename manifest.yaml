kind: "AIchorManifest"
apiVersion: "0.2.3"
builder:
  image: "delta-sharing-check"
  dockerfile: "./Dockerfile"
  context: "."
spec:
  operator: "jobset"
  image: "delta-sharing-check"
  command: "python delta_sharing_check.py"
  timeout: "30m"
  types:
    master:
      count: 1
      completions: 1
      parallelisms: 1
      resources:
        cpus: 1
        memory: 4
